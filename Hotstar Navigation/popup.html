
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Browser Navigation Keys</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">↔</div>

      <div>
        <h2>Browser Navigation</h2>
        <p>Keyboard Navigation Toolkit</p>
      </div>
    </header>

    <section class="control-card">

      <div>
        <h3>Navigation</h3>
        <p id="statusText">Loading...</p>
      </div>

      <label class="switch">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>

    </section>

    <section class="settings">

      <h3>Website Access</h3>

      <select id="scopeSelect">
        <option value="hotstar">JioHotstar Only</option>
        <option value="all">All Websites</option>
      </select>

      <p id="scopeDescription">
        Navigation works only on JioHotstar.
      </p>

    </section>

    <section class="shortcuts">

      <h3>Keyboard Shortcuts</h3>

      <div class="shortcut">
  <span>Browser Forward</span>
  <kbd>ALT + U</kbd>
</div>

<div class="shortcut">
  <span>Browser Back</span>
  <kbd>ALT + Y</kbd>
</div>

      <div class="shortcut">
        <span>Enable / Disable</span>
        <kbd>ALT + Q</kbd>
      </div>

    </section>

    <footer>
      <span id="footerStatus">Ready</span>
      <span>Version 3.0</span>
    </footer>

  </div>

  <script src="popup.js"></script>

</body>
</html>
